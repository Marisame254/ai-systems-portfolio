[project]
name = "portfolio-api"
version = "0.1.0"
description = "AI Systems Portfolio API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    "langgraph>=1.1.0",
    "langchain-core>=1.3.0",
    "langchain-openai>=1.2.0",
    "langchain-ollama>=1.1.0",
    "langchain-tavily>=0.2.0",
    "asyncpg>=0.31.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "redis>=7.4.0",
    "python-multipart>=0.0.27",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "agents", "services", "schemas"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
